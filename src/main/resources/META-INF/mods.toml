modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Curios 为可选依赖：未安装时本模组行为与原版一致，仅失去 Curios 槽位的智能还原功能
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.0,)"
    ordering="AFTER"
    side="BOTH"
